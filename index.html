<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lighthouse</title>
  <meta name="description" content="The Lighthouse Siargao church community app">
  <meta name="theme-color" content="#1F3A5F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lighthouse">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body { margin: 0; height: 100%; background: #FBF7EF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1F3A5F; }
    body { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); box-sizing: border-box; }
    #app { flex: 1; width: 100%; border: 0; display: block; background: #FBF7EF; }

    /* Splash while the app loads */
    #splash { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(120% 90% at 0% 0%, #2C4F7C 0%, #1F3A5F 55%, #172C48 100%); color: #fff; transition: opacity .35s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .badge { width: 132px; height: 132px; border-radius: 50%; background: #fff; overflow: hidden; display: grid; place-items: center;
      box-shadow: 0 0 0 6px rgba(255,255,255,.14), 0 0 40px rgba(232,163,61,.5); }
    #splash .badge img { width: 100%; height: 100%; object-fit: contain; }
    #splash h1 { margin: 0; font-size: 1.5rem; letter-spacing: .02em; }
    #splash p { margin: 0; color: rgba(255,255,255,.8); font-size: .95rem; }
    .dots { display: flex; gap: 6px; } .dots span { width: 8px; height: 8px; border-radius: 50%; background: #E8A33D; animation: pulse 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .3; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
    #slow { display: none; text-align: center; padding: 0 24px; } #slow a { color: #E8A33D; font-weight: 700; }

    /* Install bar (only in the browser, never inside the installed app) */
    #install { display: none; align-items: center; gap: 12px; padding: 10px 12px; background: #1F3A5F; color: #fff; font-size: .92rem; }
    #install.show { display: flex; }
    #install img { width: 36px; height: 36px; border-radius: 10px; background: #fff; flex: none; }
    #install .txt { flex: 1; line-height: 1.35; }
    #install button { font: inherit; border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer; min-height: 40px; }
    #install .go { background: #E8A33D; color: #1F3A5F; font-weight: 700; }
    #install .x { background: transparent; color: #fff; padding: 9px 10px; font-size: 1.1rem; }

    /* Offline / setup notices */
    .notice { margin: auto; max-width: 420px; padding: 28px 24px; text-align: center; }
    .notice img { width: 96px; height: 96px; border-radius: 50%; background: #fff; box-shadow: 0 4px 18px rgba(31,58,95,.15); }
    .notice h2 { margin: 16px 0 8px; } .notice p { color: #4a5a70; line-height: 1.5; }
    .notice button { margin-top: 12px; font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 12px 20px; background: #1F3A5F; color: #fff; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } #splash { transition: none; } }
  </style>
</head>
<body>
  <!--
    ===========================================================
    ONE THING TO CHANGE: paste your web app link between the quotes below.
    (Apps Script → Deploy → Manage deployments → copy the "Web app" URL ending in /exec)
    ===========================================================
  -->
  <script>
    window.LIGHTHOUSE_APP_URL = 'https://script.google.com/a/macros/philradsolutions.com/s/AKfycbwolb9PfwAZ_RmpaaYkM5yAHLQRJ7dxxHmnKHvAKZk1xusUj5LVTfcF873lXDrsKtYBQA/exec';
    window.LIGHTHOUSE_NAME = 'Lighthouse';
  </script>

  <div id="install" role="region" aria-label="Install the app">
    <img src="icons/icon-192.png" alt="">
    <div class="txt" id="install-text">Install the Lighthouse app</div>
    <button type="button" class="go" id="install-go" hidden>Install</button>
    <button type="button" class="x" id="install-x" aria-label="Not now">✕</button>
  </div>

  <iframe id="app" title="Lighthouse" allow="clipboard-write; web-share; geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <div id="splash" aria-live="polite">
    <div class="badge"><img src="icons/icon-512.png" alt=""></div>
    <h1 id="splash-name">Lighthouse</h1>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <p id="slow">Taking a little longer than usual… <br><a id="slow-link" href="#" target="_blank" rel="noopener">Open it directly</a></p>
  </div>

  <script>
  (function () {
    var APP = String(window.LIGHTHOUSE_APP_URL || '').trim();
    var NAME = window.LIGHTHOUSE_NAME || 'Lighthouse';
    var frame = document.getElementById('app');
    var splash = document.getElementById('splash');
    document.getElementById('splash-name').textContent = NAME;
    document.title = NAME;

    function notice(title, text, button, onClick) {
      frame.remove();
      splash.classList.add('hide');
      var d = document.createElement('div');
      d.className = 'notice';
      d.innerHTML = '<img src="icons/icon-192.png" alt=""><h2></h2><p></p>' + (button ? '<button type="button"></button>' : '');
      d.querySelector('h2').textContent = title;
      d.querySelector('p').textContent = text;
      if (button) { d.querySelector('button').textContent = button; d.querySelector('button').onclick = onClick; }
      document.body.appendChild(d);
    }

    // Not set up yet
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(APP) && !/^http:\/\/localhost(:\d+)?\//.test(APP)) {
      notice('Almost ready', 'Open index.html and paste your Apps Script web app link (ending in /exec) where it says PASTE_YOUR_WEB_APP_URL_HERE.');
      return;
    }

    // Offline
    if (navigator.onLine === false) {
      notice("You're offline", 'Lighthouse needs the internet. Connect to Wi-Fi or mobile data, then try again.', 'Try again', function () { location.reload(); });
      window.addEventListener('online', function () { location.reload(); });
      return;
    }

    // Load the app (pass ?page=… through, e.g. the guest form link)
    var qs = new URLSearchParams(location.search);
    var src = APP + (APP.indexOf('?') === -1 ? '?' : '&') + 'shell=1';
    if (qs.get('page')) src += '&page=' + encodeURIComponent(qs.get('page'));
    frame.src = src;
    document.getElementById('slow-link').href = APP;

    var done = false;
    function ready() { if (done) return; done = true; setTimeout(function () { splash.classList.add('hide'); }, 250); }
    frame.addEventListener('load', ready);
    setTimeout(function () { if (!done) document.getElementById('slow').style.display = 'block'; }, 9000);
    setTimeout(ready, 20000);

    // ---------- Install bar (browser only) ----------
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    var bar = document.getElementById('install'), txt = document.getElementById('install-text'), go = document.getElementById('install-go');
    var dismissed = false;
    try { dismissed = localStorage.getItem('lh_install_dismissed') === '1'; } catch (e) {}
    document.getElementById('install-x').onclick = function () {
      bar.classList.remove('show');
      try { localStorage.setItem('lh_install_dismissed', '1'); } catch (e) {}
    };
    var ua = navigator.userAgent || '';
    var inApp = /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\//i.test(ua);
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (!standalone && !dismissed) {
      // Inside Messenger/Facebook the app itself shows a friendly "Open in Chrome/Safari" screen,
      // so no bar here (it would say the same thing twice).
      if (!inApp && ios) {
        txt.innerHTML = 'Install: tap <strong>Share</strong> <span aria-hidden="true">⬆︎</span> then <strong>Add to Home Screen</strong>.';
        bar.classList.add('show');
      }
    }
    var deferred = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      if (standalone || dismissed) return;
      txt.textContent = 'Install the ' + NAME + ' app on your phone';
      go.hidden = false;
      bar.classList.add('show');
    });
    go.onclick = function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; bar.classList.remove('show'); });
    };
    window.addEventListener('appinstalled', function () { bar.classList.remove('show'); });

    // Offline helper (keeps this page and the logo available)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  })();
  </script>
</body>
</html>
